name: Validate analytics project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Test ingestion and dashboard
        run: pytest tests -q

      - name: Install dbt packages
        working-directory: data_pipeline
        run: dbt deps

      - name: Parse dbt project
        working-directory: data_pipeline
        run: dbt parse --profiles-dir ../.github/dbt --no-partial-parse
