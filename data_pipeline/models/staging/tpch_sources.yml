version: 2

sources:
  - name: tpch
    database: snowflake_sample_data
    schema: tpch_sf1

    tables:
      - name: orders
        columns:
          - name: o_orderkey
            data_tests:
              - not_null
              - unique

      - name: lineitem
        columns:
          - name: l_orderkey
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch', 'orders')
                    field: o_orderkey
