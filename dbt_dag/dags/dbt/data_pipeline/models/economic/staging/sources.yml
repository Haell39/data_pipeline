version: 2

sources:
  - name: bcb_raw
    description: Observações brutas extraídas da API SGS do Banco Central do Brasil.
    database: "{{ target.database }}"
    schema: raw
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after:
          count: 36
          period: hour
        error_after:
          count: 7
          period: day
    tables:
      - name: bcb_series
        description: Uma linha por série econômica e data de observação.
        columns:
          - name: series_code
            data_tests:
              - not_null
          - name: observation_date
            data_tests:
              - not_null
          - name: value
            data_tests:
              - not_null
          - name: loaded_at
            data_tests:
              - not_null
